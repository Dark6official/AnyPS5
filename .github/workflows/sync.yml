name: Scheduled Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Checks for updates automatically every day at midnight!
  workflow_dispatch: # Manual sync button.

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4

    - name: Sync upstream changes
      id: sync
      uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
      with:
        target_sync_branch: main
        target_repo_token: ${{ secrets.GITHUB_TOKEN }}
        upstream_sync_repo: Astrelix/AnyPS5
        upstream_sync_branch: main

  sync_releases:
    runs-on: ubuntu-latest
    name: Sync Releases and Tags
    steps:
    - name: Mirror Releases via Action
      uses: repo-sync/github-sync@v2
      with:
        source_repo: "https://github.com"
        source_branch: "main"
        destination_branch: "main"
        github_token: ${{ secrets.GITHUB_TOKEN }}
        sync_tags: true
